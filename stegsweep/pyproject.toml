[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegsweep"
version = "0.1.0"
description = "One command, every steg check: local CTF steganography triage."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10.0"]

[project.scripts]
stegsweep = "stegsweep.cli:main"

[tool.setuptools]
packages = ["stegsweep"]

[project.urls]
Homepage = "https://github.com/amnindersingh12/plainsight/tree/main/stegsweep"
