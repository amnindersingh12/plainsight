name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [unseen, stegsurvive, stegsweep]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show unseen-scan`, `pip show stegsurvive` or `pip show stegsweep` (Version line)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command and input
      description: The exact command you ran. Attach the input file if you can share it (zip it so GitHub does not recompress images).
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Full output, including any traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
