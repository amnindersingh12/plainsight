name: release
# Publishes to PyPI with trusted publishing (OIDC): no API tokens are stored anywhere.
# A published GitHub release uploads all three packages; versions already on PyPI are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package folder to publish
        required: true
        type: choice
        options: [unseen, stegsweep, stegsurvive]
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        package: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.package) || '["unseen","stegsweep","stegsurvive"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --outdir dist ${{ matrix.package }}
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/

  publish:
    needs: build
    # Off until the PyPI trusted publishers exist; then set repo variable PYPI_PUBLISH=true (Settings > Variables).
    if: vars.PYPI_PUBLISH == 'true'
    strategy:
      matrix:
        package: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.package) || '["unseen","stegsweep","stegsurvive"]') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package == 'unseen' && 'unseen-scan' || matrix.package }}/
    permissions:
      id-token: write  # trusted publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
