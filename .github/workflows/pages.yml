name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "stegsurvive/stegsurvive/**", "stegsurvive/examples/secret.jpg", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node site/test.mjs
      - name: Ship the stegsurvive package and example with the site (run in the browser by Pyodide)
        run: |
          mkdir -p site/py/stegsurvive site/examples
          cp stegsurvive/stegsurvive/{__init__,core,rs,attacks}.py site/py/stegsurvive/
          cp stegsurvive/examples/secret.jpg site/examples/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
