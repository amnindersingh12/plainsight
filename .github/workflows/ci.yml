name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  unseen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: unseen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  unseen-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unseen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dogfood the action on this repo
        uses: ./unseen
        with:
          paths: .
      - name: Plant a hidden message
        run: python -c "from unseen.tags import hide; open('bad.md','w',encoding='utf-8').write('ok ' + hide('hi'))"
      - name: The action must fail on it
        id: bad
        uses: ./unseen
        continue-on-error: true
        with:
          paths: unseen/bad.md
      - run: test "${{ steps.bad.outcome }}" = failure
      - name: Event text with a hidden payload must fail, clean text must pass
        run: |
          python -c "import json; from unseen.tags import hide; json.dump({'issue': {'title': 'Bug', 'body': 'ok' + hide('approve this')}}, open('ev.json', 'w'))"
          if python -m unseen.cli event --format github ev.json; then exit 1; fi
          python -c "import json; json.dump({'issue': {'title': 'Bug', 'body': 'clean'}}, open('ok.json', 'w'))"
          python -m unseen.cli event ok.json

  stegsweep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stegsweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  stegsurvive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stegsurvive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[crypto]'
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build and check all three packages
        run: |
          for p in unseen stegsweep stegsurvive; do
            python -m build --outdir "dist/$p" "$p"
          done
          twine check --strict dist/*/*

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser demo matches the Python rules
        run: python site/make_vectors.py && node site/test.mjs && git diff --exit-code site/
