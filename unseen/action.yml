name: unseen
description: Fail on invisible Unicode (hidden prompt injection, Trojan Source) in changed files
branding:
  icon: eye-off
  color: gray-dark
inputs:
  paths:
    description: "Space-separated paths to scan. Default: files changed in the pull request, else the whole repo."
    required: false
    default: ""
  args:
    description: Extra scan flags, for example --strict
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # INPUT_ARGS and INPUT_PATHS are word-split on purpose; "--" keeps file names from parsing as flags.
        if [ -n "$INPUT_PATHS" ]; then
          python3 -m unseen.cli scan --format github $INPUT_ARGS -- $INPUT_PATHS
        elif [ -n "$BASE_SHA" ]; then
          if ! git rev-parse -q --verify "$BASE_SHA^{commit}" > /dev/null; then
            echo "unseen: base commit missing, use actions/checkout with fetch-depth: 0"
            exit 2
          fi
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=d "$BASE_SHA" HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "unseen: no changed files"
            exit 0
          fi
          python3 -m unseen.cli scan --format github $INPUT_ARGS -- "${files[@]}"
        else
          python3 -m unseen.cli scan --format github $INPUT_ARGS -- .
        fi
