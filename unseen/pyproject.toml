[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unseen-scan"
version = "0.1.1"
description = "Find invisible Unicode that hides prompt injection and Trojan Source in text and code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
unseen = "unseen.cli:main"

[project.urls]
Homepage = "https://github.com/amnindersingh12/plainsight/tree/main/unseen"

[tool.setuptools]
packages = ["unseen"]
