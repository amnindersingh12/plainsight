[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseen-scan"
version = "0.2.0"
description = "Find invisible Unicode that hides prompt injection and Trojan Source in text and code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["unicode", "prompt-injection", "trojan-source", "security", "llm", "ai-safety", "github-action", "pre-commit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.scripts]
unseen = "unseen.cli:main"

[project.urls]
Homepage = "https://github.com/amnindersingh12/plainsight/tree/main/unseen"
Source = "https://github.com/amnindersingh12/plainsight/tree/main/unseen"
Issues = "https://github.com/amnindersingh12/plainsight/issues"
Changelog = "https://github.com/amnindersingh12/plainsight/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["unseen"]
